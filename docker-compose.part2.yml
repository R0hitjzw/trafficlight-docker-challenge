version: "3"

networks:
  traffic-light:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  red-app:
    build: ./red
    container_name: red-app
    networks:
      - traffic-light

  yellow-app:
    build: ./yellow
    container_name: yellow-app
    networks:
      - traffic-light

  green-app:
    build: ./green
    container_name: green-app
    networks:
      - traffic-light

  nginx-load-balancer:
    image: nginx:1.21
    container_name: nginx-load-balancer
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/part2/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - red-app
      - yellow-app
      - green-app
    networks:
      - traffic-light